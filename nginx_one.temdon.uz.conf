server {
    listen 80;
    listen 443 ssl;
    server_name one.temdon.uz;

    ssl_certificate /etc/letsencrypt/live/one.temdon.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/one.temdon.uz/privkey.pem;

    location / {
        root /var/www/chust_one/mobile_web;
        try_files $uri $uri/ /index.html;
    }

    location /chust-one-ios.mobileconfig {
        alias /var/www/chust_one/mobile_web/chust-one-ios.mobileconfig;
        default_type application/x-apple-aspen-config;
        add_header Content-Disposition "attachment; filename=chust-one-ios.mobileconfig";
    }

    location /admin {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1 {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /download/app-release.apk {
        alias /var/www/chust_one/app-release.apk;
    }
}
