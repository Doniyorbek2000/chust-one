server {
    listen 80;
    listen 443 ssl;
    server_name chustone.uz www.chustone.uz;

    ssl_certificate /etc/letsencrypt/live/chustone.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chustone.uz/privkey.pem;

    # Marketing / landing page (static, not the Flutter app)
    location / {
        root /var/www/chust_one/mobile_web;
        try_files $uri $uri/ /index.html;
    }

    # The real installable Flutter app (native course browsing, enrollment,
    # profile, etc.) — this is what iOS "Add to Home Screen" should point at.
    location /app/ {
        root /var/www/chust_one/mobile_web;
        try_files $uri $uri/ /app/index.html;
    }

    location /chust-one-ios.mobileconfig {
        alias /var/www/chust_one/mobile_web/app/chust-one-ios.mobileconfig;
        default_type application/x-apple-aspen-config;
        add_header Content-Disposition "attachment; filename=chust-one-ios.mobileconfig";
    }

    location /admin {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1 {
        proxy_pass http://127.0.0.1:5010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads {
        proxy_pass http://127.0.0.1:5010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /download/app-release.apk {
        alias /var/www/chust_one/app-release.apk;
    }
}
