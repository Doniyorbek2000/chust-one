name: chust_one_academy
description: "Chust One Academy production mobile app for Android & iOS"
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_riverpod: ^2.4.10
  go_router: ^13.2.0
  dio: ^5.4.1
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  url_launcher: ^6.2.5
  intl: ^0.20.2
  shimmer: ^3.0.0
  image_picker: ^1.1.2
  youtube_player_iframe: ^6.0.2
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/images/
